name: Fooddata Daily Import (incl. price history)

# Runs the full fooddata -> FF import on a GitHub runner DAILY.
#
# Why GitHub Actions and not a Vercel cron: the full import takes ~12 min
# (price_history alone ~11 min), which blows past Vercel's 300s function limit.
#
# Primær kørsel: Cloudflare wake → native scrape (eller Goma 14:00) → dette workflow.
# Backup 07:00 UTC skip-if-fresh hvis kæden missede.
# Requires GOMA_IMPORT_ENABLED=true so import copies source=goma (not legacy tjek:*).

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: fooddata-import
  cancel-in-progress: false

jobs:
  fooddata-import:
    runs-on: ubuntu-latest
    # Secrets ligger på GitHub Environment "FF" — jobbet SKAL pege på det
    # environment for at kunne læse dem (ellers er secrets.* tomme).
    environment: FF
    # GitHub-hostede runners tillader op til 6 timer pr. job; ~12 min import
    # ligger trygt under. Eksplicit loft som sikkerhed.
    timeout-minutes: 40
    env:
      GROCERY_SUPABASE_URL: ${{ secrets.GROCERY_SUPABASE_URL }}
      GROCERY_SUPABASE_SECRET_KEY: ${{ secrets.GROCERY_SUPABASE_SECRET_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GOMA_IMPORT_ENABLED: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify required secrets are present
        run: |
          missing=0
          for v in GROCERY_SUPABASE_URL GROCERY_SUPABASE_SECRET_KEY NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!v}" ]; then
              echo "Missing required secret: $v"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "Set the missing secrets under Settings → Environments → FF (or check the environment name matches 'environment: FF' in this workflow)."
            exit 1
          fi

      # Salling-avis på runneren (ikke Vercel). Udgåede tilbud ryddes før import,
      # også hvis Vercel-cron blev sprunget over eller timed out.
      - name: Refresh Salling leaflets (Netto / Føtex / Bilka)
        run: npx tsx scripts/grocery-sync-salling-leaflets.ts

      # Match-queue og price_history er non-fatal: katalog + offers tæller som success
      # selv hvis history/enqueue timeout'er. Scope: kun nye product ids (ikke fuld offers-scan).
      - name: Run full fooddata import (incl. price history)
        run: |
          # Cloudflare-kæde / manuel dispatch kører altid. GitHub-backup hopper over hvis FF allerede er frisk.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            npx tsx scripts/import-fooddata-to-ff.ts --skip-if-fresh
          else
            npx tsx scripts/import-fooddata-to-ff.ts
          fi

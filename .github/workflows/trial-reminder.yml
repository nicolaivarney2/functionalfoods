name: Trial reminder

# Mail dagen før prøven slutter. GitHub-runner, samme mønster som community-tick.
# Kl. 08:00 dansk sommertid (06:00 UTC).

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: trial-reminder
  cancel-in-progress: false

jobs:
  trial-reminder:
    runs-on: ubuntu-latest
    environment: FF
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LOOPS_API_KEY: ${{ secrets.LOOPS_API_KEY }}
      LOOPS_TRANSACTIONAL_ID: ${{ secrets.LOOPS_TRANSACTIONAL_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Send trial reminders
        run: npx tsx scripts/trial-reminder.ts

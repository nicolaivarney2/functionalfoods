name: Community tick

# Guidance, start-events og status-skift. GitHub-runner — samme mønster som prisalarmer.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: community-tick
  cancel-in-progress: false

jobs:
  community-tick:
    runs-on: ubuntu-latest
    environment: FF
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LOOPS_API_KEY: ${{ secrets.LOOPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Community tick
        run: npx tsx scripts/community-tick.ts

name: Dagligvarer launch health

# Watchdog efter natlig scrape + fooddata-import.
# 1) Sikrer FF-import (skip hvis allerede frisk) — fanger GitHubs skippede 05:00-cron.
# 2) Health-check + mail.
# 3) Ved røde kæder: Goma catch-up + import igen.

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

concurrency:
  group: dagligvarer-launch-health
  cancel-in-progress: false

jobs:
  ensure-import:
    runs-on: ubuntu-latest
    environment: FF
    timeout-minutes: 40
    env:
      GROCERY_SUPABASE_URL: ${{ secrets.GROCERY_SUPABASE_URL }}
      GROCERY_SUPABASE_SECRET_KEY: ${{ secrets.GROCERY_SUPABASE_SECRET_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GOMA_IMPORT_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Refresh Salling leaflets if 05:00-import missede dem
        run: npx tsx scripts/grocery-sync-salling-leaflets.ts
      - name: Import fooddata → FF if stale
        run: npx tsx scripts/import-fooddata-to-ff.ts --skip-if-fresh

  launch-health:
    needs: ensure-import
    runs-on: ubuntu-latest
    environment: FF
    timeout-minutes: 15
    outputs:
      unhealthy: ${{ steps.health.outputs.unhealthy }}
    env:
      GROCERY_SUPABASE_URL: ${{ secrets.GROCERY_SUPABASE_URL }}
      GROCERY_SUPABASE_SECRET_KEY: ${{ secrets.GROCERY_SUPABASE_SECRET_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Launch health on runner
        id: health
        run: |
          set +e
          npx tsx scripts/dagligvarer-launch-health.ts --email
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "unhealthy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "unhealthy=false" >> "$GITHUB_OUTPUT"

  repair:
    needs: launch-health
    if: needs.launch-health.outputs.unhealthy == 'true'
    runs-on: ubuntu-latest
    environment: FF
    timeout-minutes: 45
    env:
      GOMA_IMPORT_ENABLED: 'true'
      GOMA_API_KEY: ${{ secrets.GOMA_API_KEY }}
      GROCERY_SUPABASE_URL: ${{ secrets.GROCERY_SUPABASE_URL }}
      GROCERY_SUPABASE_SECRET_KEY: ${{ secrets.GROCERY_SUPABASE_SECRET_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Native catch-up (REMA / Salling hvis slottet blev missset)
        run: npx tsx scripts/grocery-sync-scheduled.ts
      - name: Goma catch-up for stale / empty chains
        run: npx tsx scripts/grocery-sync-goma-scheduled.ts --catch-up-only
      - name: Refresh Salling leaflets (Netto/Føtex/Bilka)
        run: npx tsx scripts/grocery-sync-salling-leaflets.ts
      - name: Re-import fooddata → FF
        run: npx tsx scripts/import-fooddata-to-ff.ts
      - name: Re-check health on runner
        run: npx tsx scripts/dagligvarer-launch-health.ts --email
